<?xml version="1.0" encoding="utf-8"?>
<!-- A small animated SVG: every feature the converter has to handle, once. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#0D47A1" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="10" y="10" width="80" height="80"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="60" height="60" rx="8" fill="url(#sky)"/>
    <g transform="translate(50,50)">
      <g transform="rotate(0)">
        <animateTransform attributeName="transform" type="rotate" dur="1s" begin="0s"
            calcMode="spline" values="0; 180; 360" keyTimes="0; 0.5; 1"
            keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" repeatCount="indefinite" fill="freeze"/>
        <path d="M-18,0 L0,-18 L18,0 L0,18 Z" fill="#FFFFFF" fill-opacity="0.9"/>
        <ellipse cx="0" cy="0" rx="6" ry="6" fill="#FF5722" stroke="#212121" stroke-width="2"/>
      </g>
    </g>
    <circle cx="50" cy="86" r="4" fill="#4CAF50">
      <animate attributeName="opacity" dur="1s" values="0; 1; 0" keyTimes="0; 0.5; 1"
          repeatCount="indefinite" fill="freeze"/>
    </circle>
  </g>
</svg>
