name: android_avd_splash
description: >-
  Generates an Android 12+ splash screen from a Lottie file or an animated GIF:
  a verified AnimatedVectorDrawable, its resources, and the activity wiring.
version: 1.0.0
repository: https://github.com/udyan-dev/android_avd_splash
issue_tracker: https://github.com/udyan-dev/android_avd_splash/issues
topics:
  - android
  - splash-screen
  - lottie
  - animation
  - codegen

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.7.0
  path: ^1.9.0
  xml: ^7.0.1
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  android_avd_splash: create
  avdgen: avdgen
